<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 56" role="img" aria-label="Coddy agent">
  <defs>
    <linearGradient id="cwl-plate" x1="2" y1="2" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#f1ecfe"/>
    </linearGradient>
    <linearGradient id="cwl-stroke" x1="10" y1="10" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="cwl-stroke-inner" x1="14" y1="14" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <!-- The plate matches the dark wordmark's, in light colours: without it the
       ring floats in a 56-tall column with nothing to sit in, and the gap
       between it and the word reads as a mistake rather than as spacing. -->
  <g transform="translate(28 28)">
    <rect x="-26" y="-26" width="52" height="52" rx="13" fill="url(#cwl-plate)"/>
    <rect x="-25.5" y="-25.5" width="51" height="51" rx="12.5" fill="none" stroke="#ddd6fe" stroke-width="1"/>
    <g transform="rotate(90)">
      <circle
        r="10.25"
        fill="none"
        stroke="url(#cwl-stroke)"
        stroke-width="2.85"
        stroke-linecap="round"
        stroke-dasharray="48.6 15.8"
        stroke-dashoffset="7.9"
      />
      <circle
        r="6"
        fill="none"
        stroke="url(#cwl-stroke-inner)"
        stroke-width="2"
      />
    </g>
  </g>
  <text
    x="62"
    y="35"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="23"
    font-weight="650"
    letter-spacing="-0.035em"
    fill="#18181b"
  >
    <tspan>Coddy</tspan>
    <tspan font-size="14.5" font-weight="500" fill="#52525b" dx="3">agent</tspan>
  </text>
</svg>
