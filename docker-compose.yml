# Run the published image from GitHub Container Registry (no local Dockerfile build).
# See docs/getting-started/docker.md and https://github.com/coddy-project/coddy-agent/pkgs/container/coddy-agent
#
#   export CODDY_IMAGE=ghcr.io/coddy-project/coddy-agent:TAG   # optional
#   docker compose pull
#   docker compose up -d

services:
  coddy:
    image: ${CODDY_IMAGE:-ghcr.io/coddy-project/coddy-agent:latest}
    # Default runs `coddy serve`, which starts whatever config.yaml enables:
    # the web UI, the Telegram bot, the swarm relay, the scheduler. Turning the
    # bot on is `gateways.telegram.enable: true` in the mounted config, not a
    # second container. Override only to change the flags:
    #   CODDY_COMMAND="serve -H 0.0.0.0 -P 12345 --cwd /workspace" docker compose up -d
    # The published GHCR image carries every surface, the messenger gateway
    # included (BUILD_TAGS in .github/workflows/docker-build-push.yaml).
    command: ${CODDY_COMMAND:-serve -H 0.0.0.0 -P 12345}
    ports:
      - "${CODDY_HTTP_PORT:-12345}:12345"
    working_dir: /workspace
    # The image runs as uid/gid 1000; set CODDY_UID / CODDY_GID to the owner of
    # the mounted folders when that is someone else (`id -u`, `id -g`).
    user: "${CODDY_UID:-1000}:${CODDY_GID:-1000}"
    environment:
      CODDY_HOME: /home/user/.coddy
      CODDY_CWD: /workspace
      CODDY_CONFIG: /home/user/.coddy/config.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY-}
      # Messenger gateway bot token (used only in gateway mode; empty if unset).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN-}
    volumes:
      - ${CODDY_CONFIG-./config.yaml}:/home/user/.coddy/config.yaml:ro
      - ${CODDY_CWD-./workspace}:/workspace
      - ${CODDY_HOME-./coddy_home}:/home/user/.coddy
    healthcheck:
      test: ["CMD", "/bin/coddy", "--version"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
