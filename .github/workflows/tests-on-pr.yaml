# Run the full test matrix (one job per tag combination), the race detector and
# golangci-lint on pull requests.

name: Tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # The tag combinations are written down once, in the Makefile (TEST_TAG_SETS),
  # and read from there so this file cannot drift from `make test-matrix`. The
  # OpenCode rules plugin test and the SPA's vitest suite ride along: they need
  # Node and nothing else, and they run once rather than in every combination.
  plan:
    name: Test matrix
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.sets.outputs.sets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      - name: Test project rule adapters
        run: make test-agent-rules

      - name: Test the web UI
        run: make ui-test

      - name: Read the tag combinations
        id: sets
        run: echo "sets=$(make -s print-test-tag-sets)" >> "$GITHUB_OUTPUT"

  # One job per combination, none cancelled by another's failure, so a broken
  # stub behind one tag is reported by name instead of hiding the combinations
  # a sequential run never reached. Locally `make test` is the express run over
  # the shipped tag set only; this matrix is where the partial builds are proven.
  test:
    name: Test suite (${{ matrix.tags || 'untagged' }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: ${{ fromJSON(needs.plan.outputs.sets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The ui tag embeds assets that exist only after the SPA is bundled, and
      # the MCP scenarios of the http and cli combinations start a server
      # through the real npx (features/mcp_tool_calls.feature,
      # examples/cli/cli_e2e_mcp_servers.py).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      - name: Build the embedded UI
        if: contains(matrix.tags, 'ui')
        run: make ui-build

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests
        run: go test -tags=${{ matrix.tags }} ./...

      # The console suite drives the app over a fake terminal. In the one
      # combination that is the console alone, this opens the real binary on a
      # real pty and checks the first frame, the keyboard and the exit, so the
      # tty path is proven on Linux too (test-macos does the same on macOS).
      - name: Build the console
        if: matrix.tags == 'cli'
        run: make build TAGS=cli

      - name: Drive the console through a real pty
        if: matrix.tags == 'cli'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/cli/requirements.txt
          CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_startup.py
          CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_mcp.py

      # One MCP server of every kind a user configures, on a real pty against
      # a scripted model the script serves: a native binary (built with go),
      # an npm package started through the real npx from a local folder (no
      # registry), a remote server over streamable HTTP and one over SSE. The
      # console draws first, connects them in the background, and a turn
      # calls the tool of each.
      - name: Drive the console's MCP servers of every kind through a real pty
        if: matrix.tags == 'cli'
        run: CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_mcp_servers.py

      # One-shot input through a real shell: pipes, redirects, a 200 KiB prompt
      # file, a while-read loop and a terminal, against a scripted model the
      # script serves itself (no key, no network).
      - name: Feed one-shot prompts from files and stdin
        if: matrix.tags == 'cli'
        run: |
          CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_print_input.py

      # The console's message queue (issue #364) on a real pty against a
      # scripted model the script serves: the first-use question, steer and
      # after-turn messages, /queue drop, the deferred prompt after the answer.
      - name: Drive the console's message queue through a real pty
        if: matrix.tags == 'cli'
        run: CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_queue.py

      # A long conversation in the web UI (issue #338): the real binary with a
      # 3306-message session and a swarm relay in front of it, driven in
      # Chromium. It opens on the newest page, scrolls through the history
      # without a jump, keeps a bounded DOM, follows a turn run in a second
      # browser and reads through the relay. At full speed here, where the
      # runner's own pace varies; locally it runs at CPU x4.
      - name: Build the web UI and the swarm relay
        if: matrix.tags == 'http,scheduler,ui,memory,cli,swarm'
        run: make build TAGS="http ui swarm"

      - name: Drive a long transcript in a browser
        if: matrix.tags == 'http,scheduler,ui,memory,cli,swarm'
        run: |
          npm --prefix external/ui i --no-save playwright
          (cd external/ui && npx playwright install --with-deps chromium)
          CODDY_BIN="$PWD/build/coddy" CODDY_CPU_THROTTLE=1 npm --prefix external/ui run check:transcript

      # The message queue (issue #364) through the same kind of stand: the
      # first-use question, steer and after-turn messages with an image, a mode
      # switched and a message taken back through the relay's mount, the
      # deferred prompt answered above its answer, and a Stop that keeps it.
      - name: Drive the message queue through a swarm relay
        if: matrix.tags == 'http,scheduler,ui,memory,cli,swarm'
        run: CODDY_BIN="$PWD/build/coddy" npm --prefix external/ui run check:queue

      # The views of a chat through the same kind of stand, the node asking for
      # a token of its own: the header's views menu, the edits and the
      # background tasks in the dock without a tab strip, and the Files window -
      # its tree, its tabs, a search over the whole workspace, every tier of the
      # grid in English and in Russian, and a sound playing through the relay
      # from its signed address alone.
      - name: Drive the views of a chat through a swarm relay
        if: matrix.tags == 'http,scheduler,ui,memory,cli,swarm'
        run: CODDY_BIN="$PWD/build/coddy" npm --prefix external/ui run check:files

      # The gateway suite runs the bot against the fake Bot API in-process. In
      # the combination that is the gateway alone, the real binary is started
      # against cmd/tgfake on a port and has to answer a message, so the
      # offline stand of docs/surfaces/gateway.md is proven on every pull
      # request without a Telegram token or a model.
      - name: Build the gateway
        if: matrix.tags == 'gateway'
        run: make build TAGS=gateway

      - name: Run the bot against the offline Telegram stand
        if: matrix.tags == 'gateway'
        run: CODDY_BIN="$PWD/build/coddy" examples/gateway/tg_e2e_offline.sh

  # The race detector, `make test-race`: the whole tree with every tag but ui.
  # The races fixed so far lived mostly in test harnesses - a backend swapped
  # under a running console, a step reading a stub's counter without its lock -
  # and one in the task pool, and all of them passed every ordinary run, so
  # this job is what keeps them from coming back. One
  # job, because go test already runs the packages side by side on the
  # runner's cores; without the ui tag it needs no Node.
  race:
    name: Race detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The MCP scenario of features/mcp_tool_calls.feature starts a server
      # through the real npx.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The test suite runs with ripgrep installed; the same code paths run here.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tests under the race detector
        run: make test-race

  # The suite above runs on Linux, so nothing behind //go:build windows is ever
  # compiled by it. This job type-checks that half across every tag combination
  # for the price of a cross-build, and catches a shared signature that only one
  # platform still satisfies.
  cross-build-windows:
    name: Windows cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Type-check the Windows build
        run: make check-windows

  # The Android build is GOOS=android with cgo, linked by the NDK the runner
  # carries, which the Linux suite never compiles: internal/platform has files
  # only it builds. This job type-checks that half, builds the binaries the
  # release publishes, checks that each is a position-independent executable
  # the Android system linker loads and that it needs no library beyond
  # Android's own, and keeps them as artifacts to try on a device before the
  # release.
  cross-build-android:
    name: Android cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      - name: Type-check the Android build
        run: make check-android

      - name: Build the Android binaries with the release tag set
        run: make android TAGS="$(make -s print-full-tags | tr , ' ')"

      - name: Check they are what the Android linker loads
        run: |
          for arch in arm64 amd64; do
            bin="build/coddy-android-$arch"
            file "$bin"
            LC_ALL=C readelf -h "$bin" | grep -q 'Type:.*DYN' || { echo "::error::$bin is not position-independent"; exit 1; }
            LC_ALL=C readelf -l "$bin" | grep -q 'program interpreter: /system/bin/linker64' || { echo "::error::$bin does not name the Android linker"; exit 1; }
            extra=$(LC_ALL=C readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | grep -v -x -E 'libc\.so|libdl\.so|libm\.so|liblog\.so' || true)
            if [ -n "$extra" ]; then echo "::error::$bin needs libraries Android does not ship: $extra"; exit 1; fi
          done

      - name: Pack them the way the release does
        run: |
          for arch in arm64 amd64; do
            mkdir -p "dist/android-$arch"
            cp "build/coddy-android-$arch" "dist/android-$arch/coddy"
            cp packaging/man/coddy.1 packaging/completions/coddy.bash packaging/completions/coddy.zsh "dist/android-$arch/"
            tar -C "dist/android-$arch" -czf "dist/coddy_android_$arch.tar.gz" coddy coddy.1 coddy.bash coddy.zsh
          done

      - name: Keep the arm64 archive
        uses: actions/upload-artifact@v4
        with:
          name: coddy-android-arm64
          path: dist/coddy_android_arm64.tar.gz
          retention-days: 14

      - name: Keep the x86_64 archive
        uses: actions/upload-artifact@v4
        with:
          name: coddy-android-amd64
          path: dist/coddy_android_amd64.tar.gz
          retention-days: 14

  # Cross-building proves the Windows code compiles, not that it works. These
  # packages own the behaviour that differs by platform - the process group
  # probe, the console shell, the background task pool that starts real
  # processes through it, the self-update helper that replaces a running
  # coddy.exe, the rule glob matcher that anchors drive-letter paths at the
  # workspace - and their Windows-only tests have no other place to run. The
  # scope is deliberately narrow; widen it as the rest of the tree is shown to
  # hold on Windows.
  test-windows:
    name: Test suite (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run platform tests
        run: go test ./internal/platform/... ./internal/bgtask/... ./internal/tools/shell/... ./internal/update/... ./internal/hooks/... ./internal/rules/...

      - name: Run console TUI tests (fake terminal, no pty)
        run: go test -tags=cli ./external/cli/...

      # No per-OS code in these, but their tests write files and compare paths:
      # backslash separators, no POSIX mode bits, a CRLF checkout (Git on this
      # runner converts line endings). Those expectations broke on Windows
      # unnoticed while only Linux ran them. internal/session and
      # internal/tools belong here too and are held back: on Windows the
      # mentions suite does not resolve a "~" path and the built-in docs suite
      # reads the CRLF checkout, both open at the time of writing.
      - name: Run file and path tests
        run: go test ./cmd/coddy/... ./internal/config/... ./internal/dryrun/... ./internal/swarm/...

  # The console is a raw-mode terminal program, and nothing above runs it on
  # macOS, where bare `coddy` opens on a Terminal.app pty. A hang there was
  # reported by users before it was seen in any test. This job runs the
  # platform packages and the console suite on a macOS runner, then builds
  # the console and drives the binary through a real pty: first frame, keys,
  # exit and the restored terminal.
  test-macos:
    name: Test suite (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run platform tests
        run: go test ./internal/platform/... ./internal/bgtask/... ./internal/tools/shell/... ./internal/update/... ./internal/hooks/... ./internal/rules/...

      - name: Run console TUI tests (fake terminal, no pty)
        run: go test -tags=cli ./external/cli/...

      - name: Build the console
        run: make build TAGS=cli

      - name: Drive the console through a real pty
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/cli/requirements.txt
          CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_startup.py

      - name: Feed one-shot prompts from files and stdin
        run: |
          CODDY_BIN="$PWD/build/coddy" .venv/bin/python examples/cli/cli_e2e_print_input.py

  # The packages are only built on a release tag, so without this job a broken
  # nfpm recipe would first be seen by whoever cuts the release. Lean build tags:
  # this proves the packaging, not the binary, and skipping the npm step keeps
  # the job short.
  packages:
    name: Distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build deb and rpm
        run: make deb rpm PKG_TAGS="http scheduler memory cli gateway swarm"

      # The unit is rendered by internal/serve and held to the source file by a
      # Go test; this checks that both package formats carry that file byte for
      # byte, and the maintainer scripts that tell the user it is not enabled.
      - name: Check the packaged systemd user unit
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          for package in dist/*.deb; do
            dpkg-deb --fsys-tarfile "$package" | tar -xOf - ./usr/lib/systemd/user/coddy.service | cmp - packaging/systemd/coddy.service
            dpkg-deb --ctrl-tarfile "$package" | tar -xOf - ./postinst > scripts.txt
            grep -F 'NOT enabled' scripts.txt
            dpkg-deb --ctrl-tarfile "$package" | tar -xOf - ./prerm >> scripts.txt
            grep -F 'coddy-install.conf' scripts.txt
            # The package tells the user about the unit and never turns it on.
            # An if, not "! grep": bash's errexit ignores an inverted status.
            if grep -E 'systemctl( --user| --global)? (enable|start)' scripts.txt; then
              echo "::error::$package: a maintainer script enables or starts the unit"; exit 1
            fi
          done
          for package in dist/*.rpm; do
            # rpm 4.18's rpm2cpio exits 1 after writing the whole payload, and
            # names members /usr/... where newer ones write ./usr/...; a short
            # payload still fails the cmp.
            rpm2cpio "$package" > payload.cpio || true
            cpio -i --quiet --to-stdout '*usr/lib/systemd/user/coddy.service' < payload.cpio | cmp - packaging/systemd/coddy.service
            rpm -qp --scripts "$package" > scripts.txt
            grep -F 'NOT enabled' scripts.txt        # postinstall
            grep -F 'coddy-install.conf' scripts.txt   # preremove
            if grep -E 'systemctl( --user| --global)? (enable|start)' scripts.txt; then
              echo "::error::$package: a maintainer script enables or starts the unit"; exit 1
            fi
          done

      # tmux is suggested and nothing more (issue #326): apt and zypper name it
      # during the install and leave the choice to the user. A Depends or a
      # Recommends would install it behind the user's back.
      - name: Check that the packages suggest tmux without pulling it in
        run: |
          for package in dist/*.deb; do
            dpkg-deb --field "$package" Suggests | grep -qw tmux || { echo "::error::$package does not suggest tmux"; exit 1; }
            if dpkg-deb --field "$package" Depends Pre-Depends Recommends | grep -qw tmux; then
              echo "::error::$package depends on or recommends tmux"; exit 1
            fi
          done
          for package in dist/*.rpm; do
            rpm -qp --suggests "$package" | grep -qw tmux || { echo "::error::$package does not suggest tmux"; exit 1; }
            if rpm -qp --requires "$package" | grep -qw tmux || rpm -qp --recommends "$package" | grep -qw tmux; then
              echo "::error::$package requires or recommends tmux"; exit 1
            fi
          done

      # Same reasoning one step further: the Homebrew cask is rendered only by
      # the release job and the formula only by hand, so a template that stopped
      # being valid Ruby would surface at the worst moment. Rendering needs a
      # published tag; parsing does not, and the placeholders sit inside strings.
      - name: Parse the Homebrew templates
        run: ruby -c packaging/homebrew/coddy.rb.tmpl && ruby -c packaging/homebrew/coddy-formula.rb.tmpl

  # The documentation follows the code: docs/nav.yaml, the config schema and the
  # --help screens drive the generated pages, every relative link and anchor must
  # resolve, and every asset must be used. `make docs-check` is the same gate the
  # pre-commit hook runs for documentation commits (there without the CLI build).
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the generated pages, the links and the assets
        run: make docs-check

  # The passes of `make lint` and `make lint-windows`: the untagged tree, every
  # tag but ui, and the shipped set, each for the host and for the Windows
  # build, then the TypeScript check of the web UI. The two tag lists come from
  # the Makefile (print-full-tags, print-lint-tags-no-ui), so they cannot drift
  # from what `make lint` compiles; the shipped set embeds the SPA, so the
  # assets are built first.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      - name: Build the embedded UI
        run: make ui-build

      - name: Read the lint tag lists
        id: tags
        run: |
          echo "full=$(make -s print-full-tags)" >> "$GITHUB_OUTPUT"
          echo "no_ui=$(make -s print-lint-tags-no-ui)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./...

      - name: Run golangci-lint with every tag but ui
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags ${{ steps.tags.outputs.no_ui }} ./...

      - name: Run golangci-lint with the shipped tag set
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags ${{ steps.tags.outputs.full }} ./...

      - name: Run golangci-lint against the Windows build
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: v2.12.2
          args: ./...

      - name: Run golangci-lint with every tag but ui against the Windows build
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: v2.12.2
          args: --build-tags ${{ steps.tags.outputs.no_ui }} ./...

      - name: Run golangci-lint with the shipped tag set against the Windows build
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: v2.12.2
          args: --build-tags ${{ steps.tags.outputs.full }} ./...

      - name: Type-check the web UI
        run: make ui-typecheck
