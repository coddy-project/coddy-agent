# Run full test matrix and golangci-lint on pull requests.

name: Tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: external/ui/package-lock.json

      # The grep and glob filesystem tools prefer system ripgrep and fall back
      # to a built-in Go engine, so without rg on the runner the suite only ever
      # exercises the fallback half. The runner image does not ship it, and
      # installing it with apt costs an `apt-get update`, which refreshes every
      # source the image carries - including third-party ones this project never
      # uses. On 2026-09-09 Google's chrome-stable index started serving a
      # Packages.gz whose hash did not match its Release file, apt exited 100,
      # and every pull request died in twenty seconds before `make test` ran.
      # A pinned release tarball needs only github.com, which the checkout
      # already depends on, and hands every run the same rg build.
      - name: Install ripgrep
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_SHA256: "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
        run: |
          set -euo pipefail
          probe="$(command -v rg || true)"
          echo "system rg before install: ${probe:-none}"
          dir="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 3 --retry-all-errors -o "${dir}.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${dir}.tar.gz"
          echo "${RIPGREP_SHA256}  ${dir}.tar.gz" | sha256sum --check --strict -
          tar -xzf "${dir}.tar.gz" "${dir}/rg"
          sudo install -m 0755 "${dir}/rg" /usr/local/bin/rg
          rg --version

      - name: Run tests
        run: make test

  # The suite above runs on Linux, so nothing behind //go:build windows is ever
  # compiled by it. This job type-checks that half across every tag combination
  # for the price of a cross-build, and catches a shared signature that only one
  # platform still satisfies.
  cross-build-windows:
    name: Windows cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Type-check the Windows build
        run: make check-windows

  # Cross-building proves the Windows code compiles, not that it works. These
  # packages own the behaviour that differs by platform - the process group
  # probe, the console shell, the background task pool that starts real
  # processes through it, the self-update helper that replaces a running
  # coddy.exe, the rule glob matcher that anchors drive-letter paths at the
  # workspace - and their Windows-only tests have no other place to run. The
  # scope is deliberately narrow; widen it as the rest of the tree is shown to
  # hold on Windows.
  test-windows:
    name: Test suite (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run platform tests
        run: go test ./internal/platform/... ./internal/bgtask/... ./internal/tools/shell/... ./internal/update/... ./internal/hooks/... ./internal/rules/...

      - name: Run console TUI tests (fake terminal, no pty)
        run: go test -tags=cli ./external/cli/...

  # The packages are only built on a release tag, so without this job a broken
  # nfpm recipe would first be seen by whoever cuts the release. Lean build tags:
  # this proves the packaging, not the binary, and skipping the npm step keeps
  # the job short.
  packages:
    name: Distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build deb and rpm
        run: make deb rpm PKG_TAGS="http scheduler memory cli gateway"

      # Same reasoning one step further: the Homebrew cask is rendered only by
      # the release job and the formula only by hand, so a template that stopped
      # being valid Ruby would surface at the worst moment. Rendering needs a
      # published tag; parsing does not, and the placeholders sit inside strings.
      - name: Parse the Homebrew templates
        run: ruby -c packaging/homebrew/coddy.rb.tmpl && ruby -c packaging/homebrew/coddy-formula.rb.tmpl

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./...

      - name: Run golangci-lint against the Windows build
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: v2.12.2
          args: ./...

      - name: Run golangci-lint over the cli-tagged console surface
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags cli ./external/cli/... ./cmd/coddy/...

      - name: Run golangci-lint over the cli surface for the Windows build
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: v2.12.2
          args: --build-tags cli ./external/cli/... ./cmd/coddy/...
