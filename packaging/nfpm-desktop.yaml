# nfpm recipe for the Linux packages of the desktop window (deb and rpm).
#
# A package of its own, `coddy-desktop`, and not a file added to `coddy`: the
# window carries the embedded web UI and is built with its own tags, so it is
# several times the size of the agent and has no business on a server that only
# runs `coddy serve`. The two install side by side and share no file.
#
# What it adds beyond the binary is what makes an application an application on
# a Linux desktop: an entry in /usr/share/applications, so Coddy is in the menu
# and the launcher, and its icon in the hicolor theme the entry names. Like the
# agent's package it enables nothing, creates no system account and writes
# nothing under /etc; the window's own state lives in the invoking user's
# ~/.coddy, and the autostart entry of the menu's "Open at login" is written
# into that user's own autostart folder.
#
# Staged by scripts/build-desktop-packages.sh; run `make deb-desktop` or
# `make rpm-desktop`.
#
# https://nfpm.goreleaser.com/configuration/

name: coddy-desktop
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: "1"
section: devel
priority: optional
maintainer: Pavel Rykov <paul@drteam.rocks>
vendor: Coddy project
homepage: https://coddy.dev
license: MIT
description: |
  Coddy as a desktop window, with tabs.
  coddy-desktop runs Coddy's HTTP surface on a loopback port this machine
  remembers and opens a window on a tab strip over it, one chat per tab. The
  window carries the embedded web UI, so nothing but a browser engine is
  needed; without a system frame the strip is the title bar, with the window's
  own buttons, a menu of the desktop's switches and an optional icon in the
  system tray.

# The window is opened with a browser already on the machine (Chrome, Chromium,
# Yandex Browser, Firefox), in a profile of its own. Naming one as a dependency
# would be wrong - any of them does, and CODDY_DESKTOP_BROWSER names another -
# so they are a recommendation, which apt and zypper offer and dnf records.
recommends:
  - chromium

contents:
  - src: coddy-desktop
    dst: /usr/bin/coddy-desktop
    file_info:
      mode: 0755

  # The menu entry: this is what puts Coddy in the application launcher.
  - src: coddy-desktop.desktop
    dst: /usr/share/applications/coddy-desktop.desktop
    file_info:
      mode: 0644

  # The icon that entry names, in the theme every desktop reads. The scalable
  # one is what a current desktop draws; the raster is for anything that does
  # not render SVG.
  - src: coddy-desktop.svg
    dst: /usr/share/icons/hicolor/scalable/apps/coddy-desktop.svg
    file_info:
      mode: 0644

  - src: coddy-desktop-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/coddy-desktop.png
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/coddy-desktop/LICENSE
    file_info:
      mode: 0644

  # Debian policy expects the licence at this exact path.
  - src: LICENSE
    dst: /usr/share/doc/coddy-desktop/copyright
    file_info:
      mode: 0644

deb:
  fields:
    Bugs: https://github.com/coddy-project/coddy-agent/issues

rpm:
  summary: Coddy as a desktop window, with tabs
