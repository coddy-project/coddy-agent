# nfpm recipe for the Linux packages published on every release tag.
#
# The package installs a binary, its documentation and a systemd user unit that
# it does not enable: no system service, no system account, no files under /etc.
# Coddy keeps every piece of state in the invoking user's ~/.coddy, so one
# installed package serves every user on the machine, and whether an account
# runs coddy serve as a service is that user's decision (`coddy serve install`),
# not the packager's.
#
# Not built by hand: scripts/build-packages.sh stages every file listed below
# into one directory, exports PKG_ARCH and PKG_VERSION, and runs nfpm from that
# directory - nfpm expands environment variables in scalar fields but treats
# "contents.src" as a literal glob, so the sources here are relative names.
# Run `make packages`.
#
# https://nfpm.goreleaser.com/configuration/

name: coddy
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
# The version comes from a git tag or from `git describe`, already normalised
# for deb and rpm by the build script. nfpm must not reinterpret it.
version_schema: none
release: "1"
section: devel
priority: optional
maintainer: Pavel Rykov <paul@drteam.rocks>
vendor: Coddy project
homepage: https://coddy.dev
license: MIT
description: |
  Coding agent with a console, an editor protocol and an HTTP gateway.
  Coddy runs a ReAct loop - the model reasons, calls tools, observes results -
  behind four surfaces that share one session store: an interactive console,
  an Agent Client Protocol server for editors, an OpenAI-compatible HTTP
  gateway with an embedded web UI, and a messenger gateway. It speaks to
  OpenAI, Anthropic, Ollama and any OpenAI-compatible API, merges MCP servers,
  and reads project rules, skills, subagents and hooks from the repository it
  is working in.

# tmux is suggested, not required: Coddy runs without it, and its console runs
# well inside it, where a session outlives a closed terminal or a dropped SSH
# connection. A suggestion is named and never installed: apt and zypper list it
# during the install, and it stays in the package metadata for dnf
# (rpm -q --suggests). The Homebrew cask says the same in its caveats.
replaces:
  - coddy-desktop
conflicts:
  - coddy-desktop

suggests:
  - tmux

contents:
  - src: coddy
    dst: /usr/bin/coddy
    file_info:
      mode: 0755

  - src: coddy.1.gz
    dst: /usr/share/man/man1/coddy.1.gz
    file_info:
      mode: 0644

  - src: coddy.bash
    dst: /usr/share/bash-completion/completions/coddy
    file_info:
      mode: 0644

  - src: coddy.zsh
    dst: /usr/share/zsh/site-functions/_coddy
    file_info:
      mode: 0644

  # A user unit, installed and not enabled. `coddy serve install` enables it for
  # the account that runs it; the post-install message says so.
  - src: coddy.service
    dst: /usr/lib/systemd/user/coddy.service
    file_info:
      mode: 0644

  # Plain files, not nfpm's "doc" type: that type is rpm-only, and a deb built
  # from it silently ships without /usr/share/doc - which is where the
  # post-install message sends the user for a starting config.
  - src: config.example.yaml
    dst: /usr/share/doc/coddy/config.example.yaml
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/coddy/LICENSE
    file_info:
      mode: 0644

  # Debian policy expects the licence at this exact path.
  - src: LICENSE
    dst: /usr/share/doc/coddy/copyright
    file_info:
      mode: 0644

  # BEGIN DESKTOP CONTENTS
  - src: coddy-desktop.desktop
    dst: /usr/share/applications/coddy-desktop.desktop
    file_info:
      mode: 0644

  - src: coddy-desktop.svg
    dst: /usr/share/icons/hicolor/scalable/apps/coddy-desktop.svg
    file_info:
      mode: 0644

  - src: coddy-desktop-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/coddy-desktop.png
    file_info:
      mode: 0644

  - src: coddy-desktop-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/coddy-desktop.png
    file_info:
      mode: 0644

  - src: coddy-desktop-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/coddy-desktop.png
    file_info:
      mode: 0644

  - src: coddy-desktop-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/coddy-desktop.png
    file_info:
      mode: 0644

  - src: coddy-desktop-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/coddy-desktop.png
    file_info:
      mode: 0644

  # END DESKTOP CONTENTS

scripts:
  postinstall: postinstall.sh
  preremove: preremove.sh

deb:
  # dpkg-query -S on /usr/bin/coddy is what `coddy update` asks to learn that
  # this file is package-managed; nothing here may move the binary elsewhere.
  fields:
    Bugs: https://github.com/coddy-project/coddy-agent/issues

rpm:
  summary: Coding agent with a console, an editor protocol and an HTTP gateway
