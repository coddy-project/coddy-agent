<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coddy Browser</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <strong>Coddy</strong><span id="status">Loading…</span
      ><button id="expand" title="Keep chat open">Open</button
      ><button id="stop" class="danger">Stop</button>
    </header>
    <main>
      <details id="connection" open>
        <summary>Connection</summary>
        <form id="connect-form">
          <label
            >Server address<input
              id="address"
              type="url"
              placeholder="http://localhost:12348"
              required
          /></label>
          <label
            >Extension key<input
              id="key"
              type="password"
              autocomplete="off"
              placeholder="Keep current key"
          /></label>
          <label
            >Browser name<input
              id="name"
              placeholder="Firefox — laptop"
              maxlength="100"
          /></label>
          <label class="tab"
            ><input type="checkbox" id="native-input" /><span
              >Use the local Firefox input adapter<small
                >Install coddy-browser-host first. Needed for editors that
                require real keyboard and mouse input.</small
              ></span
            ></label
          >
          <div class="row">
            <button type="submit">Connect</button
            ><button type="button" id="disconnect">Disconnect</button>
          </div>
        </form>
      </details>
      <p id="error" role="alert" hidden></p>
      <section id="permissions" aria-live="polite"></section>
      <section>
        <h2>Shared tabs</h2>
        <p class="hint">
          Only checked tabs are available to chats on this server. Stop clears
          this selection.
        </p>
        <div id="tabs"></div>
      </section>
      <details>
        <summary>Allowed websites</summary>
        <div id="allowed"></div>
      </details>
      <section>
        <h2>Chat</h2>
        <div class="row">
          <select id="sessions" aria-label="Chat">
            <option value="">New chat</option></select
          ><button id="refresh">Refresh</button>
        </div>
        <label
          >Model<select id="model">
            <option value="agent">Agent</option>
          </select></label
        >
        <div id="messages" aria-live="polite"></div>
        <div id="chat-permissions" aria-live="polite"></div>
        <form id="chat-form">
          <label
            >Message<textarea
              id="prompt"
              rows="3"
              required
              placeholder="Ask Coddy to work with a shared tab…"
            ></textarea>
          </label>
          <div class="row">
            <button id="send" type="submit">Send</button
            ><button id="cancel" type="button">Cancel turn</button>
          </div>
        </form>
      </section>
      <p class="hint" id="input-mode"></p>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
